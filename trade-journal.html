<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanPulse - Trade Journal with Setups</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { darkBg: '#0b0f19', cardBg: '#111827', cardBorder: '#1f2937' } } } }
    </script>
</head>
<body class="bg-darkBg text-gray-100 font-sans antialiased flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-cardBg border-r border-cardBorder flex flex-col justify-between hidden md:flex shrink-0">
        <div>
            <div class="p-6 border-b border-cardBorder flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-blue-600 to-indigo-500 p-2.5 rounded-xl shadow-lg"><i class="fa-solid fa-bolt text-white text-lg"></i></div>
                <h1 class="font-extrabold text-xl tracking-wider text-white">TITAN<span class="text-blue-500">PULSE</span></h1>
            </div>
            <nav class="p-4 space-y-1.5 text-sm">
                <a href="dashboard.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-gray-800/60 transition-all"><i class="fa-solid fa-house w-5"></i><span>Dashboard</span></a>
                <a href="live-chart.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-gray-800/60 transition-all"><i class="fa-solid fa-chart-line w-5"></i><span>Live Chart</span></a>
                <a href="demo-trading.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-gray-800/60 transition-all"><i class="fa-solid fa-wallet w-5"></i><span>Demo Trading</span></a>
                <a href="trade-journal.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-blue-600 text-white font-medium shadow-lg shadow-blue-600/30 transition-all"><i class="fa-solid fa-book-open w-5"></i><span>Trade Journal</span></a>
                <a href="analytics.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-gray-800/60 transition-all"><i class="fa-solid fa-chart-pie w-5"></i><span>PNL Analytics</span></a>
                <a href="settings.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-gray-800/60 transition-all"><i class="fa-solid fa-gear w-5"></i><span>Settings</span></a>
            </nav>
        </div>
        <div class="p-4 border-t border-cardBorder">
            <div class="flex items-center justify-between bg-gray-900/50 p-3 rounded-xl border border-gray-800">
                <div class="flex items-center space-x-3 truncate">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-r from-purple-500 to-indigo-500 flex items-center justify-center font-bold text-white shrink-0">TP</div>
                    <div class="truncate"><p class="text-sm font-semibold text-white truncate">Pro Trader</p><p class="text-xs text-gray-400 truncate">Indore, India</p></div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
        <header class="bg-cardBg border-b border-cardBorder h-16 flex items-center justify-between px-6 shrink-0">
            <span class="font-bold text-white tracking-wide text-sm">TRADE JOURNAL (WITH SETUP ANALYSIS)</span>
            <div class="flex items-center space-x-4">
                <div class="bg-emerald-500/10 border border-emerald-500/20 px-3 py-1.5 rounded-xl text-emerald-400 font-bold text-sm">
                    ₹<span id="headerBalance">8,50,000.00</span>
                </div>
            </div>
        </header>

        <main class="p-6 space-y-6 max-w-7xl mx-auto w-full">
            <div class="bg-cardBg border border-cardBorder p-5 rounded-2xl">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead>
                            <tr class="border-b border-gray-800 text-gray-400 text-xs uppercase">
                                <th class="py-3 px-3">Date</th>
                                <th class="py-3 px-3">Asset</th>
                                <th class="py-3 px-3">Trading Setup</th>
                                <th class="py-3 px-3">Type</th>
                                <th class="py-3 px-3">Margin (₹)</th>
                                <th class="py-3 px-3">Entry</th>
                                <th class="py-3 px-3">Status / PnL</th>
                                <th class="py-3 px-3 text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="journalTableBody" class="divide-y divide-gray-800/50"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        let balance = parseFloat(localStorage.getItem('tp_balance')) || 850000.00;
        let trades = JSON.parse(localStorage.getItem('tp_trades')) || [];
        document.getElementById('headerBalance').innerText = balance.toLocaleString('en-IN', {minimumFractionDigits: 2});

        function renderJournal() {
            let tbody = document.getElementById('journalTableBody');
            tbody.innerHTML = '';
            if(trades.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="py-6 text-center text-gray-500 text-xs">No trade history recorded yet.</td></tr>`;
                return;
            }
            trades.forEach((t) => {
                let badge = t.status === 'Active' 
                    ? `<span class="bg-blue-500/10 text-blue-400 px-2 py-0.5 rounded text-xs font-semibold">Active</span>`
                    : `<span class="${(t.pnl || 0) >= 0 ? 'text-emerald-400 bg-emerald-500/10' : 'text-red-400 bg-red-500/10'} px-2 py-0.5 rounded text-xs font-semibold">${(t.pnl || 0) >= 0 ? '+' : ''}₹${Math.abs(t.pnl || 0).toLocaleString('en-IN')}</span>`;

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-800/30 transition">
                        <td class="py-3 px-3 text-xs text-gray-400">${t.date || 'Today'}</td>
                        <td class="py-3 px-3 font-semibold text-white">${t.asset}</td>
                        <td class="py-3 px-3 text-xs text-blue-400 font-bold bg-blue-500/10 px-2 py-1 rounded w-fit">${t.setup || 'General'}</td>
                        <td class="py-3 px-3"><span class="${t.type === 'LONG' ? 'text-emerald-400 bg-emerald-500/10' : 'text-red-400 bg-red-500/10'} px-2 py-0.5 rounded text-xs font-semibold">${t.type}</span></td>
                        <td class="py-3 px-3 text-gray-300">₹${t.amount.toLocaleString('en-IN')}</td>
                        <td class="py-3 px-3 text-gray-300">₹${t.entry.toLocaleString('en-IN')}</td>
                        <td class="py-3 px-3">${badge}</td>
                        <td class="py-3 px-3 text-right">
                            ${t.status === 'Active' ? `<button onclick="closeJournalTrade(${t.id})" class="bg-red-500/10 text-red-400 px-3 py-1 rounded-lg text-xs font-medium">Close</button>` : `<span class="text-xs text-gray-500">Done</span>`}
                        </td>
                    </tr>
                `;
            });
        }

        function closeJournalTrade(id) {
            let trade = trades.find(t => t.id === id);
            if(trade) {
                trade.status = 'Closed';
                trade.pnl = trade.livePnL || 0;
                balance += trade.amount + trade.pnl;
                localStorage.setItem('tp_balance', balance);
                localStorage.setItem('tp_trades', JSON.stringify(trades));
                document.getElementById('headerBalance').innerText = balance.toLocaleString('en-IN', {minimumFractionDigits: 2});
                renderJournal();
            }
        }
        window.addEventListener('DOMContentLoaded', renderJournal);
    </script>
</body>
</html>
