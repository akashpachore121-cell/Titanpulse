<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TitanPulse Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#020617;
color:white;
}


.container{
display:flex;
min-height:100vh;
}


/* Sidebar */

.sidebar{

width:260px;
background:#0f172a;
padding:25px;

}


.logo{

font-size:28px;
font-weight:bold;
color:#38bdf8;
margin-bottom:40px;

}


.menu div{

padding:14px;
margin:10px 0;
background:#1e293b;
border-radius:10px;

}


.profile{

margin-top:50px;
background:#020617;
padding:15px;
border-radius:12px;

}


.email{

color:#94a3b8;
font-size:14px;
margin-top:8px;

}


button{

width:100%;
margin-top:20px;
padding:12px;
background:#ef4444;
color:white;
border:none;
border-radius:8px;

}



/* Main */

.main{

flex:1;
padding:30px;

}


.cards{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-top:30px;

}


.card{

background:#0f172a;
padding:25px;
border-radius:15px;

}


.card span{

color:#94a3b8;

}


.card h2{

color:#38bdf8;
margin-top:10px;

}



.chart{

height:300px;
margin-top:30px;
background:#0f172a;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
color:#64748b;

}


</style>

</head>


<body>


<div class="container">


<div class="sidebar">


<div class="logo">
TITAN<br>PULSE
</div>



<div class="menu">

<div>🏠 Dashboard</div>
<div>📈 Live Chart</div>
<div>💰 Demo Trading</div>
<div>📖 Trade Journal</div>
<div>📊 Analytics</div>

</div>



<div class="profile">

<h3>
Akash Pachore
</h3>


<p class="email">
akashpachore100@gmail.com
</p>


<button>
Logout
</button>


</div>



</div>





<div class="main">


<h1>
Workspace Dashboard
</h1>



<div class="cards">


<div class="card">
<span>
Balance
</span>

<h2>
$10,000
</h2>

</div>



<div class="card">
<span>
Today's P&L
</span>

<h2>
+$250
</h2>

</div>



<div class="card">
<span>
Win Rate
</span>

<h2>
65%
</h2>

</div>



<div class="card">
<span>
Trades
</span>

<h2>
120
</h2>

</div>



</div>





<div class="chart">

Equity Curve Coming Soon

</div>



</div>


</div>


</body>

</html>
