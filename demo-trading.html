<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanPulse - Demo Trading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { darkBg: '#0b0f19', cardBg: '#111827', cardBorder: '#1f2937' } } }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-100 font-sans antialiased flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-cardBg border-r border-cardBorder flex flex-col justify-between hidden md:flex">
        <div>
            <div class="p-6 border-b border-cardBorder flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-blue-600 to-indigo-500 p-2.5 rounded-xl shadow-lg"><i class="fa-solid fa-bolt text-white text-lg"></i></div>
                <h1 class="font-extrabold text-xl tracking-wider text-white">TITAN<span class="text-blue-500">PULSE</span></h1>
            </div>
            <nav class="p-4 space-y-1.5">
                <a href="dashboard.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-gray-800/60 transition-all"><i class="fa-solid fa-house w-5"></i><span>Dashboard</span></a>
                <a href="live-chart.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-gray-800/60 transition-all"><i class="fa-solid fa-chart-line w-5"></i><span>Live Chart</span></a>
                <a href="demo-trading.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-blue-600 text-white font-medium shadow-lg shadow-blue-600/30 transition-all"><i class="fa-solid fa-wallet w-5"></i><span>Demo Trading</span></a>
                <a href="trade-journal.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-gray-800/60 transition-all"><i class="fa-solid fa-book-open w-5"></i><span>Trade Journal</span></a>
                <a href="analytics.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-gray-800/60 transition-all"><i class="fa-solid fa-chart-pie w-5"></i><span>Analytics</span></a>
                <a href="settings.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-gray-800/60 transition-all"><i class="fa-solid fa-gear w-5"></i><span>Settings</span></a>
            </nav>
        </div>
        <div class="p-4 border-t border-cardBorder">
            <div class="flex items-center justify-between bg-gray-900/50 p-3 rounded-xl border border-gray-800">
                <div class="flex items-center space-x-3 truncate">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-r from-purple-500 to-indigo-500 flex items-center justify-center font-bold text-white shrink-0">TU</div>
                    <div class="truncate"><p class="text-sm font-semibold text-white truncate">TitanPulse User</p><p class="text-xs text-gray-400 truncate">user@email.com</p></div>
                </div>
                <button class="text-gray-400 hover:text-red-400 p-2"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </div>
    </aside>

    <!-- Content -->
    <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
        <header class="bg-cardBg border-b border-cardBorder h-16 flex items-center justify-between px-6 shrink-0">
            <h2 class="text-lg font-bold text-white">Demo Trading Terminal</h2>
            <div class="text-sm bg-gray-900 border border-gray-800 px-3 py-1.5 rounded-lg text-gray-300">
                Virtual Balance: <span class="text-emerald-400 font-bold">$10,000.00</span>
            </div>
        </header>
        <main class="p-6 space-y-6 max-w-7xl mx-auto w-full">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Order Form -->
                <div class="bg-cardBg border border-cardBorder p-5 rounded-2xl space-y-4">
                    <h3 class="font-bold text-white text-base">Place Order</h3>
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">Select Asset</label>
                        <select class="w-full bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-sm text-white outline-none">
                            <option>BTC/USDT ($64,250)</option>
                            <option>ETH/USDT ($3,480)</option>
                            <option>SOL/USDT ($142)</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">Amount (USDT)</label>
                        <input type="number" placeholder="500" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-sm text-white outline-none">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">Leverage</label>
                        <input type="range" min="1" max="50" value="10" class="w-full accent-blue-500">
                        <div class="flex justify-between text-xs text-gray-400 mt-1"><span>1x</span><span>25x</span><span>50x</span></div>
                    </div>
                    <div class="grid grid-cols-2 gap-3 pt-2">
                        <button class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-emerald-600/20">Buy / Long</button>
                        <button class="bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-red-600/20">Sell / Short</button>
                    </div>
                </div>

                <!-- Active Positions Table -->
                <div class="lg:col-span-2 bg-cardBg border border-cardBorder p-5 rounded-2xl flex flex-col">
                    <h3 class="font-bold text-white text-base mb-4">Active Virtual Positions</h3>
                    <div class="overflow-x-auto flex-1">
                        <table class="w-full text-left text-sm">
                            <thead>
                                <tr class="border-b border-gray-800 text-gray-400 text-xs uppercase">
                                    <th class="py-3 px-3">Asset</th>
                                    <th class="py-3 px-3">Type</th>
                                    <th class="py-3 px-3">Size</th>
                                    <th class="py-3 px-3">Entry</th>
                                    <th class="py-3 px-3">P&L</th>
                                    <th class="py-3 px-3 text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-800/50">
                                <tr>
                                    <td class="py-3 px-3 font-semibold text-white">BTC/USDT</td>
                                    <td class="py-3 px-3"><span class="text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded text-xs">LONG 10x</span></td>
                                    <td class="py-3 px-3 text-gray-300">$1,200</td>
                                    <td class="py-3 px-3 text-gray-300">$63,500</td>
                                    <td class="py-3 px-3 text-emerald-400 font-bold">+$142.50</td>
                                    <td class="py-3 px-3 text-right"><button class="bg-red-500/10 text-red-400 px-3 py-1 rounded-lg text-xs hover:bg-red-500/20">Close</button></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
