<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TitanPulse Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Arial,sans-serif;
}

body{
    background:#020617;
    color:white;
}


/* =========================
   LAYOUT
========================= */

.app{
    display:flex;
    min-height:100vh;
}


/* =========================
   SIDEBAR
========================= */

.sidebar{

    width:260px;

    background:#0f172a;

    border-right:1px solid #1e293b;

    padding:25px;

    position:fixed;

    left:0;
    top:0;
    bottom:0;

    display:flex;
    flex-direction:column;

}


.logo{

    font-size:28px;

    font-weight:800;

    line-height:0.9;

    color:#38bdf8;

    margin-bottom:40px;

}


.menu{
    flex:1;
}


.menu a{

    display:block;

    padding:14px;

    margin-bottom:10px;

    background:#111827;

    border-radius:10px;

    cursor:pointer;

    color:#cbd5e1;

    text-decoration:none;

    transition:.2s;

}


.menu a:hover{

    background:#1e293b;

    color:white;

}


.menu a.active{

    background:#1d4ed8;

    color:white;

}


/* =========================
   PROFILE
========================= */

.profile{

    background:#020617;

    padding:15px;

    border-radius:12px;

    border:1px solid #1e293b;

}


.profile h3{

    font-size:16px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


.profile p{

    color:#94a3b8;

    font-size:13px;

    margin-top:8px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


.logout{

    margin-top:15px;

    width:100%;

    padding:10px;

    border:none;

    border-radius:8px;

    background:#ef4444;

    color:white;

    cursor:pointer;

}


.logout:hover{

    background:#dc2626;

}


/* =========================
   MAIN
========================= */

.main{

    flex:1;

    margin-left:260px;

    padding:30px;

}


.header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;

}


.header h1{

    font-size:28px;

}


.status{

    color:#22c55e;

    font-size:14px;

}


/* =========================
   CARDS
========================= */

.cards{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(200px,1fr));

    gap:20px;

    margin-top:30px;

}


.card{

    background:#0f172a;

    border:1px solid #1e293b;

    padding:22px;

    border-radius:16px;

}


.card span{

    color:#94a3b8;

    font-size:13px;

}


.card h2{

    margin-top:10px;

    color:#38bdf8;

    font-size:24px;

}


.profit{

    color:#22c55e !important;

}


.loss{

    color:#ef4444 !important;

}


/* =========================
   CHART
========================= */

.chart-box{

    margin-top:30px;

    background:#0f172a;

    border:1px solid #1e293b;

    padding:25px;

    border-radius:16px;

}


.chart-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;

}


.chart-header h2{

    font-size:20px;

}


.chart-container{

    position:relative;

    width:100%;

    height:350px;

}


#equityChart{

    width:100% !important;

    height:100% !important;

}


/* =========================
   TRADES
========================= */

.trades{

    margin-top:30px;

    background:#0f172a;

    border:1px solid #1e293b;

    padding:25px;

    border-radius:16px;

}


.trade{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:15px;

    margin-top:12px;

    background:#020617;

    border-radius:10px;

    border:1px solid #1e293b;

}


.trade-left{

    display:flex;

    align-items:center;

    gap:12px;

}


.trade-symbol{

    font-weight:600;

}


.trade-side{

    font-size:12px;

    color:#94a3b8;

    margin-top:4px;

}


.icon{

    font-size:24px;

}


.empty{

    color:#64748b;

    text-align:center;

    padding:30px;

}


.loading{

    color:#94a3b8;

    text-align:center;

    padding:30px;

}


/* =========================
   MOBILE
========================= */

.mobile-header{

    display:none;

}


@media(max-width:800px){

    .sidebar{

        width:220px;

    }

    .main{

        margin-left:220px;

    }

}


@media(max-width:650px){

    .sidebar{

        position:relative;

        width:100%;

        height:auto;

        bottom:auto;

    }

    .app{

        display:block;

    }

    .main{

        margin-left:0;

        padding:20px;

    }

    .sidebar{

        display:block;

    }

    .menu{

        margin-bottom:20px;

    }

    .header{

        align-items:flex-start;

        flex-direction:column;

    }

    .chart-container{

        height:280px;

    }

}

</style>

</head>

<body>

<div class="app">

<!-- =========================
     SIDEBAR
========================= -->

<aside class="sidebar">

<div class="logo">

TITAN<br>PULSE

</div>

<div class="menu">

<a
href="dashboard.html"
class="active"

>

🏠 Dashboard </a>

<a
href="live-chart.html"

>

📈 Live Chart </a>

<a
href="demo-trading.html"

>

💰 Demo Trading </a>

<a
href="trade-journal.html"

>

📖 Trade Journal </a>

<a
href="analytics.html"

>

📊 Analytics </a>

<a
href="settings.html"

>

⚙️ Settings </a>

</div>

<!-- PROFILE -->

<div class="profile">

<h3 id="userName">
Loading...
</h3>

<p id="userEmail">
Loading...
</p>

<button
id="logoutButton"
class="logout"

>

Logout </button>

</div>

</aside>

<!-- =========================
     MAIN
========================= -->

<main class="main">

<div class="header">

<h1>
Workspace Dashboard
</h1>

<div class="status">
🟢 Active
</div>

</div>

<!-- =========================
     STATS
========================= -->

<div class="cards">

<div class="card">

<span>
Account Balance
</span>

<h2 id="accountBalance">
$0.00
</h2>

</div>

<div class="card">

<span>
Total P&L
</span>

<h2 id="totalProfit">
$0.00
</h2>

</div>

<div class="card">

<span>
Win Rate
</span>

<h2 id="winRate">
0%
</h2>

</div>

<div class="card">

<span>
Demo Trades
</span>

<h2 id="tradeCount">
0
</h2>

</div>

</div>

<!-- =========================
     EQUITY CURVE
========================= -->

<div class="chart-box">

<div class="chart-header">

<h2>
Equity Curve
</h2>

<span
id="equityStatus"
style="
color:#64748b;
font-size:13px;
"

>

Loading... </span>

</div>

<div class="chart-container">

<canvas id="equityChart"></canvas>

</div>

</div>

<!-- =========================
     RECENT TRADES
========================= -->

<div class="trades">

<h2>
Recent Demo Trades
</h2>

<div id="tradeList">

<div class="loading">
Loading trades...
</div>

</div>

</div>

</main>

</div>

<script type="module">


/* =====================================================
   SUPABASE
===================================================== */

import {
    createClient
}
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://ekhofgbgmitkdafrtfsd.supabase.co";


const SUPABASE_ANON_KEY =
"sb_publishable_0FO8csueB7LRmvkG-acH3A_stzvP8Ts";


const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);



/* =====================================================
   DOM
===================================================== */

const userName =
document.getElementById("userName");

const userEmail =
document.getElementById("userEmail");

const accountBalance =
document.getElementById("accountBalance");

const totalProfit =
document.getElementById("totalProfit");

const winRate =
document.getElementById("winRate");

const tradeCount =
document.getElementById("tradeCount");

const tradeList =
document.getElementById("tradeList");

const equityStatus =
document.getElementById("equityStatus");

const logoutButton =
document.getElementById("logoutButton");



let equityChart = null;



/* =====================================================
   FORMAT MONEY
===================================================== */

function formatMoney(value){

    const number =
        Number(value || 0);

    return "$" +
        number.toLocaleString(
            "en-US",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}



/* =====================================================
   FORMAT PNL
===================================================== */

function formatPNL(value){

    const number =
        Number(value || 0);

    const sign =
        number >= 0 ? "+" : "-";

    return sign +
        "$" +
        Math.abs(number).toLocaleString(
            "en-US",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}



/* =====================================================
   GET CURRENT USER
===================================================== */

async function getCurrentUser(){

    const {
        data,
        error
    } =
    await supabase.auth.getUser();


    if(error){

        console.error(
            "Auth error:",
            error
        );

        return null;

    }


    return data?.user || null;

}



/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile(user){

    const {
        data,
        error
    } =
    await supabase

        .from("profiles")

        .select(
            "full_name,email,virtual_balance,starting_balance"
        )

        .eq(
            "id",
            user.id
        )

        .maybeSingle();


    if(error){

        console.error(
            "Profile error:",
            error
        );

        return;

    }


    if(!data){

        /*
         * This should normally already exist
         * because Part 1 created the trigger.
         */

        console.warn(
            "Profile not found."
        );

        userName.textContent =
            user.user_metadata?.full_name ||
            user.user_metadata?.name ||
            "TitanPulse User";

        userEmail.textContent =
            user.email || "";

        accountBalance.textContent =
            "$10,000.00";

        return;

    }


    userName.textContent =
        data.full_name ||
        user.user_metadata?.full_name ||
        user.user_metadata?.name ||
        "TitanPulse User";


    userEmail.textContent =
        data.email ||
        user.email ||
        "";


    accountBalance.textContent =
        formatMoney(
            data.virtual_balance
        );

}



/* =====================================================
   LOAD TRADES
===================================================== */

async function loadTrades(user){

    const {
        data,
        error
    } =
    await supabase

        .from("trades")

        .select(
            "id,symbol,side,status,quantity,entry_price,exit_price,pnl,opened_at,closed_at"
        )

        .eq(
            "user_id",
            user.id
        )

        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "Trades error:",
            error
        );

        tradeList.innerHTML =
            `<div class="empty">
                Unable to load trades.
            </div>`;

        return [];

    }


    const trades =
        data || [];


    tradeCount.textContent =
        trades.length;


    /* =========================
       TOTAL PNL
    ========================= */

    const total =
        trades.reduce(
            (sum,trade) =>
                sum + Number(
                    trade.pnl || 0
                ),
            0
        );


    totalProfit.textContent =
        formatPNL(total);


    if(total >= 0){

        totalProfit.className =
            "profit";

    }else{

        totalProfit.className =
            "loss";

    }



    /* =========================
       WIN RATE
    ========================= */

    const closedTrades =
        trades.filter(
            trade =>
                trade.status === "CLOSED"
        );


    const winningTrades =
        closedTrades.filter(
            trade =>
                Number(trade.pnl || 0) > 0
        );


    let percentage = 0;


    if(closedTrades.length > 0){

        percentage =
            (
                winningTrades.length /
                closedTrades.length
            ) * 100;

    }


    winRate.textContent =
        percentage.toFixed(1) + "%";


    renderTrades(
        trades.slice(0,10)
    );


    return trades;

}



/* =====================================================
   RENDER RECENT TRADES
===================================================== */

function renderTrades(trades){

    if(!trades.length){

        tradeList.innerHTML =
            `
            <div class="empty">
                No demo trades yet.
                <br>
                Your trades will appear here.
            </div>
            `;

        return;

    }


    tradeList.innerHTML = "";


    trades.forEach(
        trade => {


            const pnl =
                Number(
                    trade.pnl || 0
                );


            const profitable =
                pnl >= 0;


            const icon =
                profitable
                ? "🟢"
                : "🔴";


            const pnlClass =
                profitable
                ? "profit"
                : "loss";


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "trade";


            div.innerHTML = `

                <div class="trade-left">

                    <span class="icon">
                        ${icon}
                    </span>

                    <div>

                        <div class="trade-symbol">
                            ${escapeHTML(
                                trade.symbol || "UNKNOWN"
                            )}
                        </div>

                        <div class="trade-side">
                            ${escapeHTML(
                                trade.side || ""
                            )}
                            •
                            ${escapeHTML(
                                trade.status || ""
                            )}
                        </div>

                    </div>

                </div>


                <div class="${pnlClass}">

                    ${formatPNL(pnl)}

                </div>

            `;


            tradeList.appendChild(
                div
            );


        }
    );

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}



/* =====================================================
   LOAD EQUITY HISTORY
===================================================== */

async function loadEquity(user){

    const {
        data,
        error
    } =
    await supabase

        .from("equity_history")

        .select(
            "id,balance,pnl,created_at"
        )

        .eq(
            "user_id",
            user.id
        )

        .order(
            "created_at",
            {
                ascending:true
            }
        );


    if(error){

        console.error(
            "Equity error:",
            error
        );

        equityStatus.textContent =
            "Unable to load";

        return;

    }


    const history =
        data || [];


    if(!history.length){

        equityStatus.textContent =
            "Waiting for trades";

        /*
         * Show starting balance
         * even before first trade.
         */

        renderEquityChart([
            {
                balance:10000,
                created_at:new Date().toISOString()
            }
        ]);

        return;

    }


    equityStatus.textContent =
        history.length +
        " points";


    renderEquityChart(
        history
    );

}



/* =====================================================
   EQUITY CHART
===================================================== */

function renderEquityChart(history){

    const canvas =
        document.getElementById(
            "equityChart"
        );


    const labels =
        history.map(
            item => {

                const date =
                    new Date(
                        item.created_at
                    );

                return date.toLocaleDateString(
                    "en-IN",
                    {
                        day:"2-digit",
                        month:"short"
                    }
                );

            }
        );


    const values =
        history.map(
            item =>
                Number(
                    item.balance
                )
        );


    if(equityChart){

        equityChart.destroy();

    }


    equityChart =
        new Chart(
            canvas,
            {

                type:"line",


                data:{

                    labels:labels,

                    datasets:[{

                        label:
                            "Account Equity",

                        data:
                            values,

                        tension:.35,

                        fill:true,

                        pointRadius:3,

                        pointHoverRadius:6

                    }]

                },


                options:{

                    responsive:true,

                    maintainAspectRatio:false,

                    interaction:{

                        intersect:false,

                        mode:"index"

                    },


                    plugins:{

                        legend:{

                            display:true,

                            labels:{

                                color:"#cbd5e1"

                            }

                        }

                    },


                    scales:{

                        x:{

                            ticks:{

                                color:"#64748b"

                            },

                            grid:{

                                color:
                                    "rgba(255,255,255,.05)"

                            }

                        },


                        y:{

                            ticks:{

                                color:"#64748b",

                                callback:
                                    function(value){

                                        return "$" +
                                            Number(value)
                                            .toLocaleString();

                                    }

                            },

                            grid:{

                                color:
                                    "rgba(255,255,255,.05)"

                            }

                        }

                    }

                }

            }
        );

}



/* =====================================================
   LOAD EVERYTHING
===================================================== */

async function loadDashboard(){

    const user =
        await getCurrentUser();


    /*
     * No authenticated user
     */

    if(!user){

        window.location.replace(
            "login.html"
        );

        return;

    }


    await loadProfile(
        user
    );


    await loadTrades(
        user
    );


    await loadEquity(
        user
    );

}



/* =====================================================
   LOGOUT
===================================================== */

logoutButton.addEventListener(
    "click",
    async function(){

        logoutButton.disabled =
            true;

        logoutButton.textContent =
            "Logging out...";


        const {
            error
        } =
        await supabase.auth.signOut();


        if(error){

            console.error(
                error
            );

            logoutButton.disabled =
                false;

            logoutButton.textContent =
                "Logout";

            return;

        }


        window.location.replace(
            "login.html"
        );

    }
);



/* =====================================================
   AUTH STATE
===================================================== */

supabase.auth.onAuthStateChange(
    function(event,session){

        if(
            event === "SIGNED_OUT"
        ){

            window.location.replace(
                "login.html"
            );

        }

    }
);



/* =====================================================
   START DASHBOARD
===================================================== */

loadDashboard();


</script>

</body>

</html>
