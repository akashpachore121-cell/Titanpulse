<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanPulse - TradingView Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { darkBg: '#0b0f19', cardBg: '#111827', cardBorder: '#1f2937' } } } }
    </script>
</head>
<body class="bg-darkBg text-gray-100 font-sans antialiased flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-cardBg border-r border-cardBorder flex flex-col justify-between hidden md:flex">
        <div>
            <div class="p-6 border-b border-cardBorder flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-blue-600 to-indigo-500 p-2.5 rounded-xl shadow-lg"><i class="fa-solid fa-bolt text-white text-lg"></i></div>
                <h1 class="font-extrabold text-xl tracking-wider text-white">TITAN<span class="text-blue-500">PULSE</span></h1>
            </div>
            <nav class="p-4 space-y-1.5">
                <a href="dashboard.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-gray-800/60 transition-all"><i class="fa-solid fa-house w-5"></i><span>Dashboard</span></a>
                <a href="live-chart.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-gray-800/60 transition-all"><i class="fa-solid fa-chart-line w-5"></i><span>Live Chart</span></a>
                <a href="demo-trading.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-blue-600 text-white font-medium shadow-lg shadow-blue-600/30 transition-all"><i class="fa-solid fa-wallet w-5"></i><span>Demo Trading</span></a>
                <a href="trade-journal.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-gray-800/60 transition-all"><i class="fa-solid fa-book-open w-5"></i><span>Trade Journal</span></a>
                <a href="analytics.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-gray-800/60 transition-all"><i class="fa-solid fa-chart-pie w-5"></i><span>Analytics</span></a>
                <a href="settings.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-gray-800/60 transition-all"><i class="fa-solid fa-gear w-5"></i><span>Settings</span></a>
            </nav>
        </div>
        <div class="p-4 border-t border-cardBorder">
            <div class="flex items-center justify-between bg-gray-900/50 p-3 rounded-xl border border-gray-800">
                <div class="flex items-center space-x-3 truncate">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-r from-purple-500 to-indigo-500 flex items-center justify-center font-bold text-white shrink-0">TU</div>
                    <div class="truncate"><p class="text-sm font-semibold text-white truncate">TitanPulse User</p><p class="text-xs text-gray-400 truncate">user@email.com</p></div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Content -->
    <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
        <header class="bg-cardBg border-b border-cardBorder h-16 flex items-center justify-between px-6 shrink-0">
            <h2 class="text-lg font-bold text-white">TradingView Advanced Terminal</h2>
            <div class="text-sm bg-gray-900 border border-gray-800 px-3 py-1.5 rounded-lg text-gray-300">
                Virtual Capital: <span id="virtualBalance" class="text-emerald-400 font-bold">₹8,50,000.00</span>
            </div>
        </header>

        <main class="p-6 space-y-6 max-w-7xl mx-auto w-full">
            <!-- Top Section: TradingView Widget + Order Form -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                <!-- TradingView Widget Container (2 Columns) -->
                <div class="lg:col-span-2 bg-cardBg border border-cardBorder p-4 rounded-2xl flex flex-col">
                    <div class="flex items-center justify-between mb-3">
                        <select id="tradeAsset" class="bg-gray-900 border border-gray-800 rounded-lg px-3 py-1.5 text-sm font-bold text-white outline-none">
                            <option value="BINANCE:BTCUSDT" data-price="6425000">BTC/USDT</option>
                            <option value="BINANCE:ETHUSDT" data-price="348000">ETH/USDT</option>
                            <option value="FX:USDINR" data-price="83.25">USD/INR [Forex]</option>
                        </select>
                        <span class="text-xs text-gray-400"><i class="fa-solid fa-circle text-emerald-500 text-[8px] mr-1"></i> Powered by TradingView</span>
                    </div>

                    <!-- TradingView Widget BEGIN -->
                    <div class="tradingview-widget-container h-[400px] w-full">
                        <div class="tradingview-widget-container__widget h-full w-full"></div>
                        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
                        {
                            "width": "100%",
                            "height": "100%",
                            "symbol": "BINANCE:BTCUSDT",
                            "interval": "D",
                            "timezone": "Asia/Kolkata",
                            "theme": "dark",
                            "style": "1",
                            "locale": "en",
                            "allow_symbol_change": true,
                            "calendar": false,
                            "support_host": "https://www.tradingview.com"
                        }
                        </script>
                    </div>
                    <!-- TradingView Widget END -->
                </div>

                <!-- Order Placement Form (1 Column) -->
                <div class="bg-cardBg border border-cardBorder p-5 rounded-2xl space-y-4 flex flex-col justify-between">
                    <div>
                        <h3 class="font-bold text-white text-base mb-3 flex items-center justify-between">
                            <span>Place Order</span>
                            <i class="fa-solid fa-sliders text-gray-400 text-xs"></i>
                        </h3>
                        <div class="space-y-3">
                            <div>
                                <label class="text-xs text-gray-400 block mb-1">Margin Amount (INR ₹)</label>
                                <input type="number" id="tradeAmount" value="25000" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-sm text-white outline-none focus:border-blue-500">
                            </div>
                            <div>
                                <label class="text-xs text-gray-400 block mb-1">Leverage</label>
                                <div class="flex space-x-2">
                                    <button class="flex-1 bg-gray-900 border border-gray-800 py-1.5 rounded-lg text-xs text-blue-400 font-bold">10x</button>
                                    <button class="flex-1 bg-gray-900 border border-gray-800 py-1.5 rounded-lg text-xs text-gray-400">20x</button>
                                    <button class="flex-1 bg-gray-900 border border-gray-800 py-1.5 rounded-lg text-xs text-gray-400">50x</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 pt-2">
                        <button onclick="executeTrade('LONG')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-emerald-600/20 text-sm">Buy / Long</button>
                        <button onclick="executeTrade('SHORT')" class="bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-red-600/20 text-sm">Sell / Short</button>
                    </div>
                </div>
            </div>

            <!-- Bottom Section: Active Positions -->
            <div class="bg-cardBg border border-cardBorder p-5 rounded-2xl">
                <h3 class="font-bold text-white text-base mb-4 flex items-center space-x-2">
                    <i class="fa-solid fa-layer-group text-purple-400"></i>
                    <span>Active Virtual Positions</span>
                </h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead>
                            <tr class="border-b border-gray-800 text-gray-400 text-xs uppercase">
                                <th class="py-3 px-3">Asset</th>
                                <th class="py-3 px-3">Type</th>
                                <th class="py-3 px-3">Margin Size</th>
                                <th class="py-3 px-3">Entry Price</th>
                                <th class="py-3 px-3">Status</th>
                                <th class="py-3 px-3 text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="activePositionsTable" class="divide-y divide-gray-800/50">
                            <!-- Dynamic rows -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Script for LocalStorage & Trade Execution -->
    <script>
        let balance = parseFloat(localStorage.getItem('tp_balance')) || 850000.00;
        let trades = JSON.parse(localStorage.getItem('tp_trades')) || [];

        function updateUI() {
            document.getElementById('virtualBalance').innerText = '₹' + balance.toLocaleString('en-IN', {minimumFractionDigits: 2});
            let tbody = document.getElementById('activePositionsTable');
            tbody.innerHTML = '';

            let activeTrades = trades.filter(t => t.status === 'Active');
            if(activeTrades.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-4 text-center text-gray-500 text-xs">No active positions open.</td></tr>`;
                return;
            }

            activeTrades.forEach((t) => {
                tbody.innerHTML += `
                    <tr>
                        <td class="py-3 px-3 font-semibold text-white">${t.asset}</td>
                        <td class="py-3 px-3"><span class="${t.type === 'LONG' ? 'text-emerald-400 bg-emerald-500/10' : 'text-red-400 bg-red-500/10'} px-2 py-0.5 rounded text-xs font-semibold">${t.type}</span></td>
                        <td class="py-3 px-3 text-gray-300">₹${t.amount.toLocaleString('en-IN')}</td>
                        <td class="py-3 px-3 text-gray-300">₹${t.entry.toLocaleString('en-IN')}</td>
                        <td class="py-3 px-3"><span class="bg-blue-500/10 text-blue-400 px-2.5 py-1 rounded-full text-xs">Active</span></td>
                        <td class="py-3 px-3 text-right"><button onclick="closeTrade(${t.id})" class="bg-red-500/10 text-red-400 px-3 py-1 rounded-lg text-xs hover:bg-red-500/20 font-medium">Close</button></td>
                    </tr>
                `;
            });
        }

        function executeTrade(type) {
            let assetSelect = document.getElementById('tradeAsset');
            let asset = assetSelect.value;
            let entryPrice = parseFloat(assetSelect.options[assetSelect.selectedIndex].getAttribute('data-price'));
            let amount = parseFloat(document.getElementById('tradeAmount').value);

            if(isNaN(amount) || amount <= 0) {
                alert('Please enter a valid margin amount in INR.');
                return;
            }
            if(amount > balance) {
                alert('Insufficient virtual INR balance!');
                return;
            }

            balance -= amount;

            let newTrade = {
                id: Date.now(),
                date: new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),
                asset: asset,
                type: type,
                entry: entryPrice,
                amount: amount,
                pnl: 0,
                status: 'Active'
            };

            trades.push(newTrade);
            localStorage.setItem('tp_balance', balance);
            localStorage.setItem('tp_trades', JSON.stringify(trades));

            updateUI();
            alert('Trade placed successfully!');
        }

        function closeTrade(id) {
            let trade = trades.find(t => t.id === id);
            if(trade) {
                trade.status = 'Closed';
                let randomPct = (Math.random() * 0.3 - 0.1); 
                trade.pnl = parseFloat((trade.amount * randomPct).toFixed(2));
                
                balance += trade.amount + trade.pnl;

                localStorage.setItem('tp_balance', balance);
                localStorage.setItem('tp_trades', JSON.stringify(trades));
                updateUI();
                alert(`Trade closed! Net PnL: ${trade.pnl >= 0 ? '+' : ''}₹${trade.pnl.toLocaleString('en-IN')}`);
            }
        }

        window.addEventListener('DOMContentLoaded', updateUI);
    </script>
</body>
</html>
